[project]
name = "workquote-mcp"
version = "1.1.0"
description = "Connect WorkQuote to ChatGPT, Claude, Codex and Claude Code through Cotlet.dev, a hosted MCP server. No WorkQuote API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["workquote", "workquote api", "workquote mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/workquote-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=workquote"
Source = "https://github.com/cotlet-connect/workquote-mcp"

[project.scripts]
workquote-mcp = "workquote_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"workquote_agent.py" = "workquote_agent.py"

[tool.hatch.build.targets.sdist]
include = ["workquote_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
